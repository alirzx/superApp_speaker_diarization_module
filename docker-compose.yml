name: superapp-speaker-diarization
services:
  # Model provisioning is a REQUIRED one-shot dependency. The DevOps pipeline
  # runs 'docker compose up --build -d' without any setup profile.
  model-setup:
    build:
      context: .
      dockerfile: backend/Dockerfile.setup
      args:
        PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
        PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
    restart: "no"
    init: true
    environment:
      MODEL_DIR: /models
      HF_HOME: ${HF_HOME:-/models/.cache}
      HF_HUB_ETAG_TIMEOUT: ${HF_HUB_ETAG_TIMEOUT:-30}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-300}
      HF_HUB_DISABLE_TELEMETRY: '1'
    volumes: [model_cache:/models]
    networks: [internal]
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_PRIMARY_INDEX_URL: ${PIP_PRIMARY_INDEX_URL:-https://package-mirror.liara.ir/repository/pypi/simple}
        PIP_FALLBACK_INDEX_URL: ${PIP_FALLBACK_INDEX_URL:-https://mirror2.chabokan.net/pypi/simple/}
    image: superapp-speaker-diarization-api:local
    depends_on:
      model-setup: {condition: service_completed_successfully}
    restart: unless-stopped
    init: true
    read_only: true
    user: app
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_TOKEN: ${API_TOKEN:-}
      MODEL_PATH: ${MODEL_PATH:-/models/Nemotron-3-Diarization.q8_0.gguf}
      MODEL_MANIFEST: ${MODEL_MANIFEST:-/models/manifest.json}
      CPU_THREADS: ${CPU_THREADS:-2}
      OMP_NUM_THREADS: ${CPU_THREADS:-2}
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-1}
      MAX_QUEUE_WAIT_SECONDS: ${MAX_QUEUE_WAIT_SECONDS:-10}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-600}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-300}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes: [model_cache:/models:ro]
    tmpfs:
      - /tmp:size=128m,mode=0700,uid=10001,gid=10001
    ports: ["${API_BIND_IP:-127.0.0.1}:${API_PORT:-8003}:8000"]
    cpus: ${API_CPUS:-2.0}
    mem_limit: ${API_MEMORY:-1500m}
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [internal]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 120s
      retries: 3

  ui:
    build: {context: ., dockerfile: frontend/Dockerfile}
    image: superapp-speaker-diarization-ui:local
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}
    environment:
      API_TOKEN: "${API_TOKEN:-}"
      APP_ENV: ${APP_ENV:-development}
    cpus: ${UI_CPUS:-0.5}
    mem_limit: ${UI_MEMORY:-256m}
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ["${UI_BIND_IP:-127.0.0.1}:${UI_PORT:-8084}:8080"]
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,size=1m,uid=101,gid=101,mode=0755
      - /var/cache/nginx:rw,size=16m,uid=101,gid=101,mode=0755
      - /var/run:rw,size=4m,uid=101,gid=101,mode=0755
      - /tmp:rw,size=8m,uid=101,gid=101,mode=0700
    networks: [internal]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3

networks: {internal: {driver: bridge}}
volumes: {model_cache: {}}
